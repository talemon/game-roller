<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roll a random game idea: Steam genres, a master plot, and optional theme, look and player details, composed into one sentence."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121417" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Game Roller</title>
    <script>
      // Mirrors src/lib/theme.svelte.ts so the first paint already has the right scheme.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('game-roller:theme');
        } catch {}
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
